name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Test replay in Chrome at desktop and phone sizes
        run: |
          python -m venv "$RUNNER_TEMP/replay-env"
          "$RUNNER_TEMP/replay-env/bin/pip" install playwright==1.56.0
          "$RUNNER_TEMP/replay-env/bin/python" tests/browser/replay.py
